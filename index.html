<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Millennial Family Finance | Smart Money Tools for Modern Families</title>
  <meta name="description" content="Free financial calculators for millennial families including budget, mortgage amortization, and investment calculators.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Millennial Family Finance</h1>
  <p>Smart Financial Tools for Modern Families</p>
</header>

<nav>
  <a href="#budget">50/30/20 Calculator</a>
  <a href="#mortgage">Mortgage Calculator</a>
  <a href="#investment">Investment Calculator</a>
  <a href="about.html">About</a>
</nav>

<section id="budget">
  <h2>50 / 30 / 20 Budget Calculator</h2>
  <input type="number" id="income" placeholder="Monthly Income">
  <button onclick="calculateBudget()">Calculate</button>
  <div id="budgetResults"></div>
</section>

<section id="mortgage">
  <h2>Mortgage & Amortization Calculator</h2>

  <input type="number" id="loanAmount" placeholder="Loan Amount">
  <input type="number" id="interestRate" placeholder="Interest Rate (%)">
  <input type="number" id="loanYears" placeholder="Loan Term (Years)">

  <button onclick="calculateMortgage()">Calculate</button>

  <div id="mortgageResults"></div>
  <div id="amortizationTable"></div>
</section>

<section id="investment">
  <h2>Investment Future Value Calculator</h2>
  <input type="number" id="investmentAmount" placeholder="Initial Investment ($)">
  <input type="number" id="monthlyContribution" placeholder="Monthly Contribution ($)">
  <input type="number" id="annualReturn" placeholder="Annual Return (%)">
  <input type="number" id="years" placeholder="Years">
  <button onclick="calculateInvestment()">Calculate</button>
  <div id="investmentResults"></div>
</section>

<footer>
  <p>© 2026 Millennial Family Finance</p>
</footer>

<script src="script.js"></script>
</body>
</html>
